- karafCommand: "log:log 'END - Install Digitall bundles'"

# The CSP editor overrides the `policy` field on the jmix:siteContentSecurityPolicy and
# jmix:pageContentSecurityPolicy mixins. Those node types are supplied by the
# content-security-policy companion module, which must be deployed so the test can enable
# it on the site it creates. csp-editor itself is deployed by the @jahia/cypress tooling
# via MODULE_ID, so it is intentionally not listed here.
- karafCommand: "log:log 'START - Install content-security-policy module'"
- installBundle:
      - 'mvn:org.jahia.modules/content-security-policy/2.5.0'
  autoStart: true
  uninstallPreviousVersion: true
- karafCommand: "log:log 'END - Install content-security-policy module'"

# No site is imported here: the test creates its own site (createSite) and enables the
# content-security-policy module on it. The Digitall bundles above are installed only to
# provide the dx-base-demo-templates template set used when creating that site.
- karafCommand: "log:log 'END - provisioning'"

